name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firstballot

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: firstballot/pnpm-lock.yaml
      # Not --frozen-lockfile: pnpm-lock.yaml currently trails package.json.
      # Switch to frozen once the lockfile is regenerated.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm type-check

  react-doctor:
    name: React doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dependency-free by design — no install step needed.
      - run: node scripts/react-doctor.mjs

  guards:
    name: Frontend guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
