name: Data freshness monitor
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh current-season data
        env:
          REFRESH_SECRET: ${{ secrets.DATA_REFRESH_SECRET }}
        run: |
          if [ -z "$REFRESH_SECRET" ]; then
            echo "DATA_REFRESH_SECRET is required for the freshness monitor."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --request POST \
            --header "Authorization: Bearer $REFRESH_SECRET" \
            https://www.firstballotff.com/api/internal/refresh-data > /tmp/espn-refresh.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/espn-refresh.json'))
          assert data.get('season'), 'Refresh response did not include the active season'
          open('/tmp/current-season.txt','w').write(str(data['season']))
          PY
      - name: Refresh current-season projections
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            https://www.firstballotff.com/api/projections > /tmp/projections-refresh.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/projections-refresh.json'))
          season=open('/tmp/current-season.txt').read().strip()
          assert str(data.get('season')) == season, 'Projection season does not match ESPN season'
          assert data.get('count', 0) > 0, 'Projection response has no player rows'
          PY
          curl --fail --silent --show-error --max-time 30 \
            https://www.firstballotff.com/api/data-health > /tmp/pre-refresh-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/pre-refresh-health.json'))
          week=data.get('currentWeek')
          open('/tmp/current-week.txt','w').write(str(week or ''))
          PY
          WEEK=$(cat /tmp/current-week.txt)
          if [ -n "$WEEK" ]; then
            curl --fail-with-body --silent --show-error --max-time 60 \
              "https://www.firstballotff.com/api/projections?week=$WEEK" > /tmp/weekly-projections.json
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/weekly-projections.json'))
          season=open('/tmp/current-season.txt').read().strip()
          week=int(open('/tmp/current-week.txt').read().strip())
          assert str(data.get('season')) == season, 'Weekly projection season does not match ESPN season'
          assert data.get('week') == week, 'Weekly projection response does not match the active week'
          assert data.get('count', 0) > 0, 'Weekly projection response has no player rows'
          PY
          fi
      - name: Repair missing or lagging tier publication
        env:
          REFRESH_SECRET: ${{ secrets.DATA_REFRESH_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://www.firstballotff.com/api/data-health > /tmp/tier-health-before.json
          NEEDS_REFRESH=$(python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          data=json.load(open('/tmp/tier-health-before.json'))
          keys={row['key']:row for row in data['datasets']}
          tier=keys.get('dynasty:tiers:v1')
          ktc=keys.get('ktc:player-values')
          if not ktc or ktc.get('status') == 'expired':
              print('no')
          elif not tier or tier.get('status') == 'expired':
              print('yes')
          else:
              source=(tier.get('source_observed_at') or '')[:10]
              observed=ktc.get('sourceObservedAt') or ''
              fetched=tier.get('fetched_at') or ''
              age=(datetime.now(timezone.utc)-datetime.fromisoformat(fetched.replace('Z','+00:00'))).total_seconds() if fetched else float('inf')
              print('yes' if source < observed or age > 26*3600 else 'no')
          PY
          )
          if [ "$NEEDS_REFRESH" = yes ]; then
            test -n "$REFRESH_SECRET"
            curl --fail-with-body --silent --show-error --max-time 300 \
              --retry 3 --retry-all-errors --retry-delay 20 --retry-max-time 1200 \
              --request POST --header "Authorization: Bearer $REFRESH_SECRET" \
              https://www.firstballotff.com/api/dynasty-tiers > /tmp/tier-repair.json
            python3 - <<'PY'
          import json
          result=json.load(open('/tmp/tier-repair.json'))
          assert result.get('refreshed') is True or result.get('reason') == 'SUPERSEDED_BY_NEWER_PUBLICATION', result
          PY
          fi
      - name: Verify data health
        run: |
          curl --fail --silent --show-error --max-time 30 https://www.firstballotff.com/api/data-health > /tmp/data-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/data-health.json'))
          season=open('/tmp/current-season.txt').read().strip()
          keys={d['key']:d for d in data['datasets']}
          expected=[f'espn:ppr:{season}', f'sleeper:projections:{season}:season', 'ktc:player-values', 'dynasty:tiers:v1']
          week=open('/tmp/current-week.txt').read().strip()
          if week:
              expected.append(f'sleeper:projections:{season}:{week}')
          missing=[key for key in expected if key not in keys]
          assert not missing, f'Missing monitored datasets: {missing}'
          expired=[key for key in expected if keys[key]['status']=='expired']
          assert not expired, f'Dataset freshness budget exceeded: {expired}'
          if int(season) < 2027:
              prospects=keys.get('prospects:2027')
              assert prospects, 'Missing 2027 prospect class'
              count=prospects.get('recordCount') or 0
              checked=prospects.get('currentSeasonStatCount') or 0
              assert prospects.get('lastCheckedAt'), '2027 ESPN check has not run'
              assert checked/count >= 0.95, f'2027 current-season stat coverage is {checked}/{count}'
              assert prospects['status'] != 'expired', '2027 ESPN check is overdue'
          unknown=[d['key'] for d in data.get('monitored',[]) if d['status']=='source-time-unknown']
          if unknown:
              print('Source observation timestamps are not provided by: ' + ', '.join(unknown))
          old_records=[f"{d['key']} ({d['recordAgeDays']} days since newest row edit)" for d in data.get('monitored',[]) if d.get('recordUpdateWarning')]
          if old_records:
              print('Review prospect records with old edit timestamps; these do not prove source age: ' + ', '.join(old_records))
          PY
      - name: Alert on freshness failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Data freshness incident in:title' --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title 'Data freshness incident' \
              --body "The hourly refresh or publication check failed. Review the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and restore fresh data before serving rankings."
          fi
      - name: Resolve freshness alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Data freshness incident in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --comment "The hourly data freshness check passed in [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
