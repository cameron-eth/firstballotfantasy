name: Refresh KTC history
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail on purpose to test the job report and alert path
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
# One run at a time per job; a scheduled run waits instead of overlapping a manual one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record start
        run: echo "STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Simulate failure
        if: inputs.simulate_failure
        run: |
          echo "Failing on purpose (simulate_failure)."
          exit 1
      # The scraper code is pinned (audit R2-3): it only changes through a PR that bumps
      # this SHA. Bump it after reviewing the SDK diff.
      - uses: actions/checkout@v4
        with:
          repository: cameron-eth/sleeper-sdk
          ref: 1e057a0e88d6e3c17ec7ac8144f35da33332d60d
          path: sdk-source
      # The SDK also commits each day's snapshot. Those JSON files are read from its main
      # branch, data only: no code runs from this checkout, and the import validates them.
      - uses: actions/checkout@v4
        with:
          repository: cameron-eth/sleeper-sdk
          path: sdk-data
          sparse-checkout: data/ktc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./sdk-source/python
      - name: Scrape today's board with SDK validation
        run: python sdk-source/python/scripts/snapshot_ktc.py --out-dir sdk-data/data/ktc
      - name: Import full archive
        run: python firstballot/scripts/import-ktc-history.py sdk-data/data/ktc firstballot/data/ktc-history.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Writes only days not yet marked complete, oldest first, and marks each one after
      # verifying its row count. The tier build reads only marked days.
      - name: Persist new KTC days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node firstballot/scripts/sync-ktc-values.mjs
      - name: Publish global dynasty tiers
        env:
          REFRESH_SECRET: ${{ secrets.DATA_REFRESH_SECRET }}
        run: |
          test -n "$REFRESH_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 \
            --retry 3 --retry-all-errors --retry-delay 20 --retry-max-time 1200 \
            -X POST -H "Authorization: Bearer $REFRESH_SECRET" \
            https://www.firstballotff.com/api/dynasty-tiers > /tmp/tier-publish.json
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/tier-publish.json'))
          assert result.get('refreshed') is True or result.get('reason') == 'SUPERSEDED_BY_NEWER_PUBLICATION', result
          PY
      - name: Propose refreshed dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firstballot/data/ktc-history.json
          if git diff --cached --quiet; then exit 0; fi
          BRANCH="codex/ktc-history-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m 'Refresh KTC history'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'Refresh KTC history' --body 'Daily validated SDK scrape and complete history import. Empty snapshots are rejected.'
      - name: Report run
        if: always()
        uses: ./.github/actions/job-report
        with:
          job: KTC history
          dataset: job:ktc-history
          status: ${{ job.status }}
          started-at: ${{ env.STARTED_AT }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          github-token: ${{ github.token }}
          alert: 'true'
